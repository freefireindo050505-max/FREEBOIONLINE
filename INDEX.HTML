    </script><script>
        const wrapper = document.getElementById('bannerWrapper');
        let autoplayInterval;
        const intervalTime = 5000; // Tempo em milissegundos (5 segundos)

        // Função principal de scroll
        function scrollBanner(direction) {
            const itemWidth = wrapper.querySelector('.banner-item').clientWidth;
            const gap = parseInt(window.getComputedStyle(wrapper).gap) || 0;
            const maxScrollLeft = wrapper.scrollWidth - wrapper.clientWidth;
            
            // Lógica de loop para o autoplay
            if (direction === 1 && wrapper.scrollLeft >= maxScrollLeft - 10) {
                // Se estiver no fim e for para a direita, volta para o início
                wrapper.scrollTo({ left: 0, behavior: 'smooth' });
            } else if (direction === -1 && wrapper.scrollLeft <= 0) {
                // Se estiver no início e for para a esquerda, vai para o fim
                wrapper.scrollTo({ left: maxScrollLeft, behavior: 'smooth' });
            } else {
                // Scroll padrão
                wrapper.scrollBy({
                    left: (itemWidth + gap) * direction,
                    behavior: 'smooth'
                });
            }
        }

        // Função para cliques manuais (reseta o timer)
        function manualScroll(direction) {
            scrollBanner(direction);
            startAutoplay(); // Reinicia o contador para evitar conflito
        }

        // Inicia ou reinicia o ciclo automático
        function startAutoplay() {
            clearInterval(autoplayInterval);
            autoplayInterval = setInterval(() => {
                scrollBanner(1);
            }, intervalTime);
        }

        // Inicia o autoplay ao carregar (apenas se for desktop/largura grande)
        window.addEventListener('load', () => {
            if (window.innerWidth > 1024) {
                startAutoplay();
            }
        });

        // Pausa autoplay se o mouse estiver sobre o banner no desktop
        wrapper.addEventListener('mouseenter', () => clearInterval(autoplayInterval));
        wrapper.addEventListener('mouseleave', () => {
            if (window.innerWidth > 1024) startAutoplay();
        });
    </script><script>
